<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Anabel Miryana · Home</title>

<style>
  @font-face {
    font-family: 'Arial Variable';
    src: url('fonts/Arial Variable.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  :root{
    --font: 'Inter Tight', Helvetic;
    --bg: #f4efe6;
    --ink: #111111;
    --muted: #5a5a5a;
    --accent: #1a1a1a;
    --accent-color: #b6ff3a;
    --hover-blue: #1e3a8a;
  }

  *{
    box-sizing: border-box;
    cursor: auto;
  }

  html{
    background: var(--bg);
  }

  body{
    font-family: 'Arizona Variable', serif;
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
  }

  /* ---------- Fondo de video ---------- */
  #bg-video{
    position: fixed;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(1.25) contrast(1.05);
  }

  /* ---------- Cabecera: menú arriba + nombre debajo ---------- */
  .site-header{
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    padding: clamp(1.1rem, 4vh, 2.25rem) clamp(1.25rem, 6vw, 6rem) 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }

  /* ---------- Menú: cuatro palabras repartidas en una fila ---------- */
  .menu{
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
  }

  .menu-item{
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'terminal-grotesque', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    color: #000000;
    font-size: clamp(0.95rem, 2.2vw, 1.85rem);
    line-height: 1;
    letter-spacing: -0.01em;
    padding: 0.1em 0;
    transition: color 0.25s ease, transform 0.25s ease;
  }

  .menu-item:hover{
    color: #ff5fa2;
    transform: translateY(-3px);
  }

  .info-window .text-block--about p {
    margin: 0 0 0.7em;
  }

  .info-window .text-block--about .about-contact {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1.5rem;
    margin: 0 0 2.5rem;
    font-size: clamp(0.85rem, 0.95vw, 1rem);
    letter-spacing: 0.04em;
  }

  .info-window .text-block--about .about-contact a {
    color: #000000;
    text-decoration: underline;
    text-underline-offset: 3px;
    transition: color 0.25s ease;
  }

  .info-window .text-block--about .about-contact a:hover {
    color: #ff5fa2;
  }

  /* Name as a bold title with a small subtitle underneath (Cargo-style) */
  .info-window .text-block--about .about-name {
    margin: 0 0 1rem;
    font-size: clamp(2rem, 3.2vw, 3.2rem);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.01em;
    text-transform: none;
  }

  .info-window .text-block--about .about-subtitle {
    margin: 0 0 0.8rem;
    font-size: clamp(0.85rem, 0.95vw, 1rem);
    letter-spacing: 0.04em;
    color: rgba(0, 0, 0, 0.75);
  }

  @media (max-width: 560px){
    .site-header{
      padding-left: 1rem;
      padding-right: 1rem;
    }
    .menu{
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem 1.25rem;
    }
    .menu-item{
      font-size: 1rem;
    }
  }

  /* ---------- Big pop-up overlay (keeps original page styles) ---------- */
  .info-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: clamp(6.5rem, 15vh, 8.5rem) clamp(1rem, 4vw, 3rem) clamp(2rem, 6vh, 4rem);
    background: rgba(244, 239, 230, 0.6);
    opacity: 0;
    overflow-y: auto;
    transition: opacity 0.3s ease;
  }

  .info-overlay.is-open {
    opacity: 1;
  }

  .info-overlay[hidden] {
    display: none;
  }

  .info-window {
    position: relative;
    width: min(94vw, 1480px);
    color: #000000;
    transform: translateY(14px) scale(0.985);
    opacity: 0;
    transition: transform 0.3s ease, opacity 0.3s ease;
  }

  .info-overlay.is-open .info-window {
    transform: translateY(0) scale(1);
    opacity: 1;
  }

  .info-window:focus {
    outline: none;
  }

  .info-content {
    width: 100%;
  }

  /* ---- Text pages (artist statement / about) : original .text-block style ---- */
  .info-window .text-block {
    background: rgba(0, 0, 0, 0.03);
    border: 1px solid rgba(0, 0, 0, 0.12);
    padding: 1.5rem 2rem 2rem;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    text-align: center;
    color: #000000;
    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(1rem, 1.2vw, 1.28rem);
    line-height: 1.55;
  }

  .info-window .text-block--left {
    text-align: left;
    background: rgba(244, 239, 230, 0.18);
    margin-left: 0;
  }

  /* ---- About me : portrait fills the pop-up, text in a glass panel on the left ---- */
  .info-window--about {
    min-height: min(88vh, 860px);
    display: flex;
    align-items: flex-start;
    background-image:
      linear-gradient(100deg, rgba(244, 239, 230, 0.97) 0%, rgba(244, 239, 230, 0.88) 42%, rgba(244, 239, 230, 0.12) 70%, rgba(244, 239, 230, 0.05) 100%),
      url('web/images/Artist Statement/Sensing_bodies_portrait.webp');
    background-size: cover;
    background-position: center;
  }

  /* ---- About me + Works : full-page window, menu stays visible on top ---- */
  .info-overlay--full {
    padding: 0;
    background: var(--bg);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }

  .info-overlay--full .info-window {
    width: 100%;
    min-height: 100dvh;
    padding: clamp(6.5rem, 15vh, 8.5rem) 0 clamp(2rem, 6vh, 4rem);
    transform: none;
  }

  .info-overlay--full .info-window--about {
    display: block;
    padding: 0;
    background: var(--bg);
  }

  /* First screen of About: portrait with the intro text on the left */
  .about-hero {
    position: relative;
    min-height: 100dvh;
    display: flex;
    align-items: flex-start;
    padding: clamp(6.5rem, 15vh, 8.5rem) 0 clamp(2rem, 6vh, 4rem);
    background-image:
      linear-gradient(rgba(244, 239, 230, 0.75) 0%, rgba(244, 239, 230, 0) 22%),
      linear-gradient(100deg, rgba(244, 239, 230, 0.97) 0%, rgba(244, 239, 230, 0.88) 42%, rgba(244, 239, 230, 0.12) 70%, rgba(244, 239, 230, 0.05) 100%),
      linear-gradient(rgba(244, 239, 230, 0) 80%, var(--bg) 100%),
      url('web/images/Artist Statement/Sensing_bodies_portrait.webp');
    background-size: cover;
    background-position: center;
  }

  /* ---- CV below the portrait: two columns of sections, date + details rows ---- */
  .about-cv {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: clamp(2rem, 5vw, 5rem);
    padding: clamp(2rem, 6vh, 4rem) clamp(1.5rem, 5vw, 4.5rem) clamp(4rem, 10vh, 6rem);
    color: #000000;
    font-size: clamp(0.95rem, 1vw, 1.05rem);
    line-height: 1.6;
    text-align: left;
  }

  .about-cv .cv-section {
    padding: clamp(2rem, 5vh, 3rem) 0;
  }

  .about-cv h3 {
    margin: 0 0 1.75rem;
    font-size: clamp(1.15rem, 1.4vw, 1.4rem);
    font-weight: 700;
  }

  .about-cv .cv-list {
    margin: 0;
    font-size: clamp(1.05rem, 1.25vw, 1.3rem);
    line-height: 1.65;
  }

  .about-cv .cv-row {
    display: grid;
    grid-template-columns: 9.5rem minmax(0, 1fr);
    gap: 1rem;
    margin: 0 0 1.75rem;
  }

  .about-cv .cv-date {
    font-size: 0.88rem;
    color: rgba(0, 0, 0, 0.75);
  }

  .about-cv small {
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    color: rgba(0, 0, 0, 0.7);
  }

  .about-cv .cv-contact {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1.5rem;
    margin: 0;
  }
  .about-cv .cv-contact a {
    color: #000000;
    text-decoration: underline;
    text-underline-offset: 3px;
    transition: color 0.25s ease;
  }
  .about-cv .cv-contact a:hover { color: #ff5fa2; }

  /* Friends: third page of About, the picture fills the screen */
  .about-cv .cv-friends {
    grid-column: 1 / -1;
    /* the picture fills the last screen, fading in and out like the portrait at the top */
    min-height: 100dvh;
    margin: 0 calc(-1 * clamp(1.5rem, 5vw, 4.5rem)) calc(-1 * clamp(4rem, 10vh, 6rem));
    padding: clamp(6rem, 18vh, 10rem) clamp(1.5rem, 5vw, 4.5rem) clamp(4rem, 10vh, 6rem);
    border-top: 0;
    background:
      linear-gradient(var(--bg) 0%, rgba(244, 239, 230, 0) 30%),
      linear-gradient(rgba(244, 239, 230, 0) 75%, var(--bg) 100%),
      linear-gradient(100deg, rgba(244, 239, 230, 0.97) 0%, rgba(244, 239, 230, 0.88) 35%, rgba(244, 239, 230, 0.1) 65%, rgba(244, 239, 230, 0) 100%),
      url('web/images/contact/contact-picture.webp') center / cover no-repeat;
  }

  .about-cv .cv-friends { position: relative; }
  .about-cv .cv-friends-credit {
    position: absolute;
    right: var(--edge);
    bottom: var(--edge);
    margin: 0;
    font-size: 0.8rem;
    color: #000000;
  }

  .about-cv .cv-friends-list {
    padding: 0;
    list-style: none;
  }

  .about-cv .cv-friends-list a {
    color: #000000;
    text-decoration: underline;
    text-underline-offset: 3px;
    transition: color 0.25s ease;
  }

  .about-cv .cv-friends-list a:hover {
    color: #ff5fa2;
  }

  @media (max-width: 760px) {
    .about-cv {
      grid-template-columns: 1fr;
    }
    .about-cv .cv-row {
      grid-template-columns: 6.5rem minmax(0, 1fr);
    }
  }

  /* Menu + contact line always stay on top, in every window and while scrolling */
  .site-header {
    z-index: 55;
  }

  /* While a window is open, the strip behind the menu is the same colour as the page,
     so pictures scroll cleanly underneath it instead of showing through */
  body.window-open .site-header {
    background: var(--bg) !important;
  }

  /* About text: one column on the left (clear of the portrait), set tighter so it fits on one screen */
  .info-window .text-block--about {
    text-align: left;
    width: min(100%, 720px);
    max-width: 720px;
    /* Text size follows the screen's width AND height, so the intro always fits on the first screen */
    font-size: clamp(0.95rem, min(1.35vw, 2.2vh), 1.45rem);
    line-height: 1.45;
    margin: 0;
    margin-left: clamp(1.5rem, 5vw, 4.5rem);
    padding: clamp(0.5rem, 2vh, 1.25rem) clamp(1.75rem, 4vw, 2.75rem);
    background: none;
    border: 0;
  }

  .info-window .text-block h2 {
    font-weight: 700;
    font-size: clamp(1.7rem, 2.2vw, 2.8rem);
    line-height: 1.1;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin: 0 0 1.5rem;
    color: #000000;
  }

  .info-window .artist-portrait {
    display: block;
    width: min(100%, 420px);
    height: auto;
    margin: 0 auto 1.5rem;
    border-radius: 12px;
    border: 1px solid rgba(0, 0, 0, 0.14);
  }

  /* ---- Contact : same box style as the Artistic Research window ---- */
  .info-window .contact-panel {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 1.5rem 2rem 2.25rem;
    box-sizing: border-box;
    background: rgba(0, 0, 0, 0.03);
    border: 1px solid rgba(0, 0, 0, 0.12);
    color: #000000;
    text-align: center;
    font-size: clamp(1rem, 1.2vw, 1.28rem);
    line-height: 1.55;
  }

  .info-window .contact-panel h2 {
    margin: 0 0 1.5rem;
    font-weight: 700;
    font-size: clamp(1.7rem, 2.2vw, 2.8rem);
    line-height: 1.1;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #000000;
  }

  .info-window .contact-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.75rem 3rem;
  }

  .info-window .contact-links a {
    color: #000000;
    text-decoration: underline;
    text-underline-offset: 3px;
    transition: color 0.25s ease;
  }

  .info-window .contact-links a:hover {
    color: var(--hover-blue);
  }

  /* ---- Work : gallery — 3 columns, every image the same size ---- */
  .info-window .symbol-list {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    column-gap: clamp(1.5rem, 3vw, 3rem);
    width: 100%;
    margin: 0;
    padding: 0 clamp(1rem, 3vw, 3rem);
  }

  .info-window .work-card {
    display: flex;
    flex-direction: column;
    width: 100%;
    min-width: 0;
    margin: 0 0 clamp(2.5rem, 5vw, 4.5rem);
    color: #000000;
    text-decoration: none;
  }

  .info-window .work-card img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border: 0;
    transition: opacity 0.25s ease;
  }

  .info-window .work-card:hover img,
  .info-window .work-card:focus-visible img {
    opacity: 0.8;
  }

  /* Name, then medium, under each image */
  .info-window .work-card span {
    order: 2;
    margin-top: 0.75rem;
    font-family: 'terminal-grotesque', monospace;
    font-size: clamp(0.85rem, 1vw, 1.1rem);
    line-height: 1.2;
    letter-spacing: 0.03em;
    color: #000000;
    transition: color 0.25s ease;
  }

  .info-window .work-card .work-card-category {
    order: 3;
    margin-top: 0.3rem;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(0, 0, 0, 0.6);
  }

  .info-window .work-card:hover span:not(.work-card-category) {
    color: var(--hover-blue);
  }

  @media (max-width: 900px) {
    .info-window .symbol-list {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 560px) {
    .info-window .symbol-list {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 560px) {
    .info-window .contact-links {
      flex-direction: column;
      gap: 0.6rem;
    }

    /* About me on small screens: full-width scrim, text panel below the face */
    .about-hero {
      align-items: flex-end;
      padding-top: 7.5rem;
      background-image:
        linear-gradient(rgba(244, 239, 230, 0.35), rgba(244, 239, 230, 0.75)),
        url('');
    }
    .info-window .text-block--about {
      width: 100%;
      max-width: none;
      margin: 0;
      border-radius: 0;
      border-left: 0;
      border-right: 0;
      border-bottom: 0;
    }
  }

  /* Background video only: no pop-out button when the mouse is over it */
  #bg-video {
    pointer-events: none;
  }

  /* ---------- Menu bar: no tint or line, no blur ---------- */
  .site-header,
  .detail-menu {
    padding-top: clamp(0.9rem, 2.6vh, 1.4rem) !important;
    padding-bottom: clamp(0.9rem, 2.6vh, 1.4rem) !important;
    background: none !important;
    border-bottom: 0;
  }

  .menu,
  .detail-menu {
    align-items: center !important;
  }

  .menu-item,
  .detail-menu-item {
    position: relative;
    padding: 0.5em 0 !important;
    border: 0 !important;
    background: none !important;
    transform: none !important;
    transition: color 0.3s ease !important;
  }


  /* Artistic Research + Contact: no box around the text, nothing behind it */
  .info-window .text-block:not(.text-block--about),
  .info-window .contact-panel {
    background: none !important;
    border: 0 !important;
    box-shadow: none !important;
  }

  /* Contact: full page like About — menu on top, picture behind, same fades, text centred */
  .info-overlay.info-overlay--full.info-overlay--contact {
    background:
      linear-gradient(rgba(244, 239, 230, 0.75) 0%, rgba(244, 239, 230, 0) 22%),
      linear-gradient(100deg, rgba(244, 239, 230, 0.97) 0%, rgba(244, 239, 230, 0.88) 42%, rgba(244, 239, 230, 0.12) 70%, rgba(244, 239, 230, 0.05) 100%),
      url('web/images/contact/contact-picture.webp') center / cover no-repeat;
  }

  .info-overlay--contact .info-window {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .info-overlay--contact .info-window .contact-panel {
    width: min(100%, 720px);
    max-width: 720px;
    margin: 0 auto !important;
    padding: clamp(0.5rem, 2vh, 1.25rem) clamp(1.75rem, 4vw, 2.75rem);
    text-align: center;
  }

  .info-overlay--contact .info-window .contact-panel h2 {
    font-size: clamp(2rem, 3.2vw, 3.2rem);
    letter-spacing: -0.01em;
    text-transform: none;
    margin: 0 0 1.5rem;
  }

  .info-overlay--contact .info-window .contact-links {
    justify-content: center;
    gap: 0.75rem 2.5rem;
    font-size: clamp(1.15rem, 1.6vw, 1.6rem);
    font-weight: 700;
  }

  /* Friends section under the contact links */
  .info-overlay--contact .contact-friends {
    margin: 0;
  }

  .info-overlay--contact .contact-friends h3 {
    margin: 0 0 1rem;
    font-size: clamp(1.15rem, 1.4vw, 1.4rem);
    font-weight: 700;
    color: #000000;
  }

  .info-overlay--contact .contact-friends ul {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem 2rem;
    font-size: clamp(1.05rem, 1.35vw, 1.45rem);
  }

  .info-overlay--contact .contact-friends a {
    color: #000000;
    text-decoration: underline;
    text-underline-offset: 3px;
    transition: color 0.25s ease;
  }

  .info-overlay--contact .contact-friends a:hover,
  .info-overlay--contact .contact-links a:hover {
    color: #ff5fa2;
  }

  /* Hidden on screen, still read by screen readers */
  .visually-hidden {
    position: absolute !important;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  /* Arrow at the bottom of the first About screen: tells people to scroll */
  .scroll-hint {
    position: absolute;
    left: 50%;
    bottom: clamp(1rem, 4vh, 2.25rem);
    transform: translateX(-50%);
    padding: 0.5rem;
    border: 0;
    background: none;
    color: #000000;
    cursor: pointer;
    animation: scroll-hint-bob 1.8s ease-in-out infinite;
    transition: color 0.25s ease;
  }

  .scroll-hint:hover { color: #ff5fa2; }

  /* Arrows: same place on every page, right ones centred in the right margin, left ones in the left margin.
     On the portrait it sits on the hair, so it is beige to show on the dark green */
  .about-hero .scroll-hint {
    left: calc(100% - var(--edge) / 2);
    top: 47%;
    bottom: auto;
    color: var(--bg);
    animation: none;
  }
  .about-hero .scroll-hint:hover { color: #ff5fa2; }
  .about-hero .scroll-hint svg { display: block; transform: rotate(-90deg); }

  /* Same place on the CV page, in black on the beige */
  .about-cv-page .cv-next {
    position: absolute;
    left: calc(100% - var(--edge) / 2);
    top: 47%;
    bottom: auto;
    z-index: 1;
    color: #000000;
    animation: none;
  }
  .about-cv-page .cv-next svg { display: block; transform: rotate(-90deg); }
  .about-cv-page .cv-next:hover { color: #ff5fa2; }

  /* On a phone the text covers the picture, so the button goes back to the bottom, in black */
  @media (max-width: 900px) {
    .about-hero .scroll-hint {
      left: auto;
      right: var(--edge);
      top: auto;
      bottom: clamp(1rem, 4vh, 2.25rem);
      transform: none;
      color: #000000;
    }
  }

  /* About only scrolls sideways, to the right: portrait, CV, Friends.
     Every page fits one screen, so scrolling up and down does nothing */
  .about-track {
    display: flex;
    width: 100%;
    height: 100dvh;
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior-x: contain;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .about-track::-webkit-scrollbar { display: none; }

  .about-track > .about-hero,
  .about-cv-page {
    flex: 0 0 100%;
    height: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
  }
  .about-track > .about-hero { min-height: 0; overflow-y: auto; }
  .about-cv-page { position: relative; }
  .about-cv-page > .about-cv {
    height: 100%;
    overflow-y: auto;
    align-content: start;
    /* first headings start at the same height as the first Works row */
    padding-top: calc(clamp(6.5rem, 15vh, 8.5rem) - clamp(2rem, 5vh, 3rem));
    background: var(--bg);
  }
  /* The CV fits one screen: three columns, the second starts where the Works pictures start */
  @media (min-width: 901px) {
    .about-cv-page > .about-cv--grid {
      grid-template-columns: minmax(0, 1fr) repeat(2, 24.25vw);
      column-gap: 1.8vw;
      padding-top: clamp(6.5rem, 15vh, 8.5rem);
      padding-bottom: 0;
    }

      <a class="work-row" href="index.html#project-2" data-tags="electronics">

          <p class="work-row-sub">Interactive installation, 2026</p>

      <p>&ldquo;When I emigrated, I left behind the body I had there. I abandoned an identity that I will never get back, forgetting a part of me that was mine and can never be again. Identities I no longer own, but once were.&rdquo;</p>
      <p>Immigration has been a core theme in my research, and this experience shapes my concepts. I see technology as an immigration process, shaping and taking form in different contexts: we adapt to technology, technology adapts to us, and I adapt to this new reality while carrying my culture with me. I see it as a process where technology becomes a tool to transform identity, rewrite history, or even immigrate into a new digital world. That is where my passion for interactive wearables comes from.</p>

      </p>
      <p>I am an interactive artist and designer, building a vision of a future that reflects on our present society. My practice explores poetic-political questions around heritage, identity, movement, sexuality, intimacy, and humanness.</p>
      <p>In my work, the body becomes a subject of connection and transformation, taking the shape of an instrument, an interface, and a medium through which technology can reimagine the future.</p>
      <p>I create transdisciplinary artworks mixing performance, sound, installation, illustration, wearable electronics, computer graphics, and creative coding. I use technology to extend the senses, enhance connection, and bridge the physical and digital worlds.</p>
      <p>Collaboration and community are central to my process, allowing me to build a network with other artists and explore different methodologies, mediums, and fields. I have engaged with the live-coding scene in Rotterdam and Amsterdam, and I have collaborated in medialab spaces such as Tabakalera in San Sebastián.</p>

  <script>
    // Works: pictures fade in slowly as they scroll into view (and again when scrolling back)
    var workImageObserver = ('IntersectionObserver' in window) ? new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        entry.target.classList.toggle('is-visible', entry.isIntersecting);
      });
    }, {
      threshold: 0.12
    }) : null;

    function watchWorkImages() {
      if (!workImageObserver) return;
      workImageObserver.disconnect();
      document.querySelectorAll('#info-content .work-row img').forEach(function (img) {
        img.classList.add('reveal');
        workImageObserver.observe(img);
      });
    }

    // Home: close any open window and go back to the home screen
    function goHome() {
      if (!infoOverlay.hidden) closeInfo();
    }

    var infoOverlay = document.getElementById('info-overlay');
    var infoWindow = document.getElementById('info-window');
    var infoContent = document.getElementById('info-content');
    var lastTrigger = null;
    var closeTimer = null;

    function openInfo(key, trigger) {
      var tpl = document.getElementById('tpl-' + key);
      if (!tpl) return;

      if (closeTimer) { window.clearTimeout(closeTimer); closeTimer = null; }

      lastTrigger = trigger || null;
      infoContent.innerHTML = '';
      infoContent.appendChild(tpl.content.cloneNode(true));
      watchWorkImages();
      infoWindow.classList.toggle('info-window--about', key === 'about');
      var fullPage = key === 'about' || key === 'work' || key === 'artist-statement';
      infoOverlay.classList.toggle('info-overlay--full', fullPage);
      document.body.classList.toggle('full-open', fullPage);

      document.body.classList.add('window-open');
      infoOverlay.scrollTop = 0;
      siteHeader.style.transform = '';
      infoOverlay.hidden = false;
      void infoOverlay.offsetWidth; // force reflow so the transition plays
      infoOverlay.classList.add('is-open');

      document.querySelectorAll('[aria-controls="info-overlay"]').forEach(function (btn) {
        btn.setAttribute('aria-expanded', 'false');
      });
      if (trigger) trigger.setAttribute('aria-expanded', 'true');
      infoWindow.focus({ preventScroll: true });
    }

    function closeInfo() {
      infoOverlay.classList.remove('is-open');
      document.querySelectorAll('[aria-controls="info-overlay"]').forEach(function (btn) {
        btn.setAttribute('aria-expanded', 'false');
      });
      closeTimer = window.setTimeout(function () {
        closeTimer = null;
        infoOverlay.hidden = true;
        infoContent.innerHTML = '';
        document.body.classList.remove('window-open');
        siteHeader.style.transform = '';
        infoOverlay.classList.remove('info-overlay--full');
        document.body.classList.remove('full-open');
      }, 300);
      if (lastTrigger) lastTrigger.focus();
    }

    // The menu is not pinned: when a window scrolls, the menu moves up with the page and goes out of view
    var siteHeader = document.querySelector('.site-header');
    infoOverlay.addEventListener('scroll', function () {
      siteHeader.style.transform = 'translateY(' + (-infoOverlay.scrollTop) + 'px)';
    }, { passive: true });

    infoContent.addEventListener('click', function (event) {
      // About has three pages side by side: each arrow scrolls to the page it names
      var arrow = event.target.closest('[data-page]');
      if (arrow) goToPage(infoContent.querySelector('.about-track'), Number(arrow.dataset.page));
    });
    function goToPage(track, page) {
      track.scrollTo({ left: page * track.clientWidth, behavior: 'smooth' });
    }
    // Works labels: show only the works with that skill; All, or pressing it again, shows them all
    infoContent.addEventListener('click', function (event) {
      var label = event.target.closest('[data-filter]');
      if (!label) return;
      var on = label.dataset.filter !== 'all' && label.getAttribute('aria-pressed') !== 'true';
      var active = on ? label : infoContent.querySelector('[data-filter="all"]');
      infoContent.querySelectorAll('[data-filter]').forEach(function (b) {
        b.setAttribute('aria-pressed', b === active ? 'true' : 'false');
      });
      infoContent.querySelectorAll('.work-row').forEach(function (row) {
        var match = !on || row.dataset.tags.split(' ').indexOf(label.dataset.filter) !== -1;
        row.classList.toggle('is-hidden', !match);
      });
      infoOverlay.scrollTop = 0;
    });
    infoOverlay.addEventListener('click', function (event) {
      if (event.target === infoOverlay) closeInfo();
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !infoOverlay.hidden) closeInfo();
    });

    // Focus trap: keep Tab focus inside the open dialog
    function isFocusable(el) {
      if (!el || el.disabled) return false;
      var tag = el.tagName;
      if (tag === 'A') return !!el.href;
      if (tag === 'BUTTON' || tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return true;
      if (el.tabIndex > 0) return true;
      return false;
    }

    function getTrapFocusables() {
      var list = Array.prototype.slice.call(
        infoOverlay.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')
      );
      // The top menu stays visible and usable in every window
      list = Array.prototype.slice.call(document.querySelectorAll('.menu .menu-item')).concat(list);
      return list.filter(isFocusable);
    }

    document.addEventListener('keydown', function (event) {
      if (event.key !== 'Tab' || infoOverlay.hidden || !infoOverlay.classList.contains('is-open')) return;
      var focusables = getTrapFocusables();
      if (focusables.length === 0) {
        event.preventDefault();
        infoWindow.focus();
        return;
      }
      var first = focusables[0];
      var last = focusables[focusables.length - 1];
      var active = document.activeElement;
      var inside = focusables.indexOf(active) !== -1;
      if (event.shiftKey) {
        if (active === first || !inside) {
          event.preventDefault();
          last.focus();
        }
      } else if (active === last || !inside) {
        event.preventDefault();
        first.focus();
      }
    });

    // Si llegamos con #work, #about, #artist-statement (desde un proyecto), abrir ese popup
    var hashKey = window.location.hash.slice(1);
    if (['work', 'about', 'artist-statement'].indexOf(hashKey) !== -1) {
      openInfo(hashKey, document.getElementById('nav-' + hashKey));
    }
  </script>

<script>
  /* Videos have no controls, so make sure they start: try now, and again on the first click, key, touch or scroll
     (some browsers block autoplay until the visitor interacts with the page) */
  (function () {
    function playAll() {
      document.querySelectorAll('video').forEach(function (v) {
        v.muted = true;
        if (v.paused && v.offsetParent !== null) {
          var p = v.play();
          if (p && p.catch) p.catch(function () {});
        }
      });
    }
    playAll();
    window.addEventListener('load', playAll);
    ['pointerdown', 'keydown', 'touchstart', 'wheel', 'scroll'].forEach(function (type) {
      window.addEventListener(type, playAll, { passive: true, capture: true });
    });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) playAll(); });
  })();
</script>
